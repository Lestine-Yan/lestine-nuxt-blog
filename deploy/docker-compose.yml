services:
  nuxt-blog:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: lestine-nuxt-blog
    restart: unless-stopped
    ports:
      - "${DEPLOY_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
